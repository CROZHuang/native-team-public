name: Native Team compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build the shared wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - id: digest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          wheel, = Path("dist").glob("*.whl")
          print("sha256=" + hashlib.sha256(wheel.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-team-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x64, os: ubuntu-24.04, arch: x64}
          - {name: Windows x64, os: windows-2025, arch: x64}
          - {name: macOS Apple Silicon, os: macos-15, arch: arm64}
          - {name: macOS Intel, os: macos-15-intel, arch: x64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-team-wheel
          path: dist
      - name: Prepare pinned cryptography source build on Intel Mac
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          xcrun --find clang
          rustc --version
          if ! test -f "$(brew --prefix openssl@3)/include/openssl/ssl.h"; then
            brew install openssl@3
          fi
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Test the installed wheel
        env:
          WHEEL_SHA256: ${{ needs.build.outputs.sha256 }}
          RUNNER_ARCH_EXPECTED: ${{ matrix.arch }}
        shell: bash
        run: python scripts/check_release.py dist --sha256 "$WHEEL_SHA256" --arch "$RUNNER_ARCH_EXPECTED"
